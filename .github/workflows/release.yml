name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pumpfun-sniper-bot-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pumpfun-sniper-bot-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pumpfun-sniper-bot-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pumpfun-sniper-bot-windows-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/your_bot_name*
